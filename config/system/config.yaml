# ===== 随机整活玩法 =====
# #抽个cp（随机两个群友配一个双人表情）和 #整活（一个人连出好几个表情拼一张图）的总开关
enableFun: true
# 同一个群里这两条指令各自的冷却（秒）。0 为不限。
# 一次「整活」要连做好几张图，而 meme 服务是单进程 Python，
# 被连点就会把普通 #摸头 一起拖慢
funCooldown: 20
# #整活 一次做几个表情。上限 9 ——
# QQ 气泡里图片最多显示约 420px 宽，8 格已经是「表情名还读得清」的边界
comboCount: 6
# #整活 的结果怎么发。
#   true  —— 合并转发，每张原图一条（默认）。表情里有不少是动图，
#            拼成一张网格图只能取首帧，看着像坏了
#   false —— 拼成一张网格图，一眼看全但全是静态首帧
# 转发发不出去时（适配器不支持、9 张加起来超过 10MB）会自动退回网格图
comboForward: true
# 只挑「安全」的表情来随机。
# 这两条指令是插件替用户挑表情，挑中什么就直接发出去，没人来得及拦；
# 而索引里混着相当一批成人向表情（装了 crazy_emoji 之后尤其多），
# 一次整活连出 6 张，撞上一张就够社死。开着就会跳过
# protectList 里的表情 + 下面 funExcludeWords 命中的表情。
# 关掉表示「我就是要玩这些」（`#整活 @主人` 那条路仍受 masterProtect 保护）
funSafeOnly: true
# 随机整活时按关键词/分类排除的词。
# protectList 是手工维护的固定 key 列表，新装一个表情仓库就会漏；
# 词表对新表情同样生效，实测能在 protectList 之外再挡掉 30 多个
# （舔系列、飞机杯、甩鸡鸡、打胶、渔网袜、扔屎…）
funExcludeWords:
  - 撅
  - 鞭
  - 舔
  - 嗦
  - 尻
  - 自慰
  - 飞机杯
  - 口交
  - 榨
  - 情趣
  - 奶子
  - 裸
  - 插
  - 射
  - 鸡鸡
  - 牛子
  - 打胶
  - 群p
  - sm
  - 舌吻
  - 玉足
  - 渔网袜
  - 发情
  - 屎
  - 验孕
  - 包养
  - 未亡人
  - 嘴你
  - 唑一唑

# ===== 表情套娃 =====
# #套娃 一次最多叠几层。写死的上限 5 —— 动图一层就放大不少，
# 再多叠别说发不出去，生成时间也受不了
nestMaxSteps: 3
# 套娃过程中任何一层的成品图超过这个大小（MB）就停手，
# 已叠好的照发。实测动图链第三层能到 6.7MB，真会触发
nestMaxSize: 4

# ===== 全员表情 =====
# #全群摸头 一次随机抽多少个群友。上限 9 ——
# 结果是一条消息里发好几张原图（动图能动），抽太多会顶到消息体积上限
crowdCount: 6

# ===== 猜表情 =====
# #猜表情 的总开关。它要监听每一条群消息（看看是不是有人猜对了），
# 不玩就把这个关掉，省一次全量遍历
enableGuess: true
# 一局的时限（秒）。超时出提示公布答案
guessTimeout: 60

# ===== 黑名单 / 群开关 =====
# 关掉了表情包的群号。群管或主人在群里发 #meme关闭 会写进这里，#meme开启 移除。
# 存「关掉的群」而不是「开启的群」——默认全开，新入的群不用先开一遍。
# 关掉的群里除了 #meme开关 之外的表情指令一律静默不响应
disabledGroups: []
# 拉黑的 QQ 号。这些人发表情相关指令一律不响应，
# 且是静默放行不回提示 —— 回「你被拉黑了」反而给了对方刷屏的抓手
blackUsers: []
# 拉黑的表情。填英文 key（如 petpet）或中文关键词（如 摸头）都行；
# 按关键词拉黑会连带屏蔽该表情的全部别名，不会从另一个名字绕进来。
# 过滤做在索引层，所以生成、搜索、分类、列表、随机、Web 预览站全都查不到
blackMemes: []

# ===== 列表 / 搜索 =====
# 列表每页表情数。列表和搜索一样走自己拼的网格图（每个表情都有真实预览图），
# 所以受同一条约束：QQ 气泡里图片最多显示约 420px 宽，每格宽 = 420 ÷ 列数。
# 24 个排 6 列 4 行、每格约 70px 还能看清长相，名字另有文字版补一份。
# 调大只会更糊，想一次看全去 Web 预览站
pageSize: 24
# 搜索/分类最多出几个表情的预览图。
# 这两个走自己拼的网格图（每个表情都有真实预览图）。
# 别调太大：QQ 气泡里图片最多只显示约 420px 宽，格子一多每格就只剩几个像素，
# 表情名彻底读不了 —— 24 个约每格 105px，80 个（12 列）只剩 35px、字 2.9px。
# 想一次看全去 Web 预览站，调大这个数只会更糊
searchMaxPreview: 24
# 分类列表里，只显示表情数 >= 该值的 tag（tag 很碎，1 个的没必要列）
tagMinCount: 2

# ===== Web 预览站 =====
enableWeb: true
webPort: 3132
# 对外访问地址，群里发的链接用它。留空则用 http://localhost:webPort
webUrl: ""
# 站内在线生成：上传图/填文字/选参数，点一下直接出表情。
# 注意 Web 站是公开的、不带 token，开着就意味着任何能访问该端口的人
# 都能消耗你的 meme 服务算力，所以下面按 IP 限了频。不想开就关掉
enableWebMake: true
# 每个 IP 每分钟最多生成几次（同时进行的生成固定不超过 2 个）
webMakeLimit: 10
# 预览图落盘缓存（服务端 preview 接口没有缓存，全量约 830 张 ≈ 166MB）
enablePreviewCache: true
# 预览图 / 缩略图缓存各自的容量上限（MB）。
# 超了就淘汰最久没被读到的，删到上限的 80%。
# 全量预览图约 166MB、缩略图再加一份，留 0 表示不限
maxCacheMB: 300

# ===== 更新 =====
# meme 服务在 pm2 里的进程名。
# 注意：必须用【名字】不能用数字 ID —— pm2 的数字 ID 会随进程增删而错位
memePm2Name: "meme"
# 表情仓库的存放目录。
# 留空则用 data/meme-plugin/repos/（一键部署时会用这个）。
# 如果机器上已经有仓库了（比如 /opt/meme），务必填成那个路径 ——
# 否则插件会另克隆一份，而 meme 服务读的还是旧路径，更新了也不生效。
# 填了以后要和 ~/.config/meme_generator/config.toml 的 meme_dirs 保持一致。
reposDir: ""
# 订阅的表情仓库。dir 是仓库目录名，
# memeSubDir 是该仓库里存放表情的子目录（各仓库结构不同）
repos:
  - name: meme_emoji
    dir: meme_emoji
    url: "https://github.com/anyliew/meme_emoji"
    branch: main
    memeSubDir: emoji
  - name: meme-generator-contrib
    dir: meme-generator-contrib
    url: "https://github.com/MemeCrafters/meme-generator-contrib"
    branch: main
    memeSubDir: memes
  - name: meme-generator-jj
    dir: meme-generator-jj
    url: "https://github.com/jinjiao007/meme-generator-jj"
    branch: master
    memeSubDir: memes
  # crazy_emoji 内容偏成人向，装上后建议把相关关键词加进 protectList
  - name: crazy_emoji
    dir: crazy_emoji
    url: "https://github.com/anyliew/crazy_emoji"
    branch: main
    memeSubDir: emoji
  - name: tudou-meme
    dir: tudou-meme
    url: "https://github.com/LRZ9712/tudou-meme"
    branch: main
    memeSubDir: meme
# GitHub 代理前缀，留空为直连（推荐，本机通常已配 git 代理）。
# 公共前缀镜像经常失效，git 报 403/522 就是它挂了，清空改直连即可
gitProxy: ""

# ===== 可选部署 =====
# 是否已经用 #meme部署 部署过本机服务。脚本执行成功后自动置 true
deployed: false
# 部署时 pm2 的进程名。默认与上面的 memePm2Name 不同，
# 避免覆盖机器上已有的 meme 进程
deployPm2Name: "meme-plugin"
# 部署出来的服务监听哪个端口。机器上已经有一个 meme 服务占着 2233 时改这里，
# 否则新装的那套一起来就撞端口、被 pm2 反复重启。
# 部署成功后 memeApiUrl 会自动指向这个端口
deployPort: 2233
# pip 镜像源，留空用默认源
pipIndexUrl: "https://pypi.tuna.tsinghua.edu.cn/simple"
